version: '3.8'

services:
  traefik:
    image: traefik:v3.2.3
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--log.level=INFO"
      # HTTPS configuration using Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@sepana.io"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # HTTP to HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    networks:
      - metanet1
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`metabase.sepana.io`) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=admin:$$apr1$$9bUqPFoU$$J0HkX5jKl.Ni5CDnCBQmX."

  metabase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metabase
    depends_on:
      - traefik
      - postgres
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=${MB_DB_DBNAME:-metabase}
      - MB_DB_PORT=${MB_DB_PORT:-5432}
      - MB_DB_USER=${MB_DB_USER:-metabase}
      - MB_DB_PASS=${MB_DB_PASS:-metabase}
      - MB_DB_HOST=${MB_DB_HOST:-postgres}
      - JAVA_TIMEZONE=UTC
    volumes:
      - metabase-data:/metabase-data
    networks:
      - metanet1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`metabase.sepana.io`)"
      - "traefik.http.routers.metabase.entrypoints=websecure"
      - "traefik.http.routers.metabase.tls=true"
      - "traefik.http.routers.metabase.tls.certresolver=letsencrypt"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: metabase-postgres
    environment:
      - POSTGRES_USER=${MB_DB_USER:-metabase}
      - POSTGRES_PASSWORD=${MB_DB_PASS:-metabase}
      - POSTGRES_DB=${MB_DB_DBNAME:-metabase}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - metanet1
    restart: always

networks:
  metanet1:
    driver: bridge

volumes:
  metabase-data:
  postgres-data: